<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>CI/CD Pipeline - Project 3</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    padding: 48px 56px;
    text-align: center;
    max-width: 640px;
    backdrop-filter: blur(10px);
  }
  h1 { font-size: 2.2rem; margin-bottom: 8px; }
  .version {
    display: inline-block;
    background: #22c55e;
    color: #06280f;

    padding: 6px 18px;

  .flow {
    margin-top: 28px;
    font-size: 0.95rem;
    color: #93c5fd;

  }

</style>
</head>
<body>
  <div class="card">
    <h1>🚀 CI/CD Pipeline on AWS</h1>
    <div class="version">Version 2.0</div>

    Every <b>git push</b> triggers the pipeline and updates this server.</p>
    <div class="flow">GitHub → CodePipeline → CodeBuild → CodeDeploy → EC2</div>
